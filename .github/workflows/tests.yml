name: regression-tests

# Every push and pull request runs the full regression suite. Each test pins down a bug that once
# hit this tool in the field (duplicate exports, skipped chats, lost evidence CSV, ignored Pause,
# blank screen reads, ...), so a change that brings one back fails HERE - not on a phone.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile every module
        run: python -m py_compile adb_core.py whatsapp_batch.py bt_transfer.py contacts_extract.py adb_gui.py
      - name: Regression suite (standard library only - no device, no installs)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
